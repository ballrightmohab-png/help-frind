name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Needed so the tag build can attach the finished .levipack to a release, and
# so the build can publish its own size/flag summary as a commit status.
permissions:
  contents: write
  statuses: write

jobs:
  tests:
    name: host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the optimization engine tests
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Wno-unused-parameter \
            -Isrc -Itests/stubs \
            tests/optimizations_test.cpp src/Optimizations.cpp src/Settings.cpp \
            -o leviboost_tests
          ./leviboost_tests

      - name: Run the tests under AddressSanitizer and UBSan
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -Wno-unused-parameter \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc -Itests/stubs \
            tests/optimizations_test.cpp src/Optimizations.cpp src/Settings.cpp \
            -o leviboost_tests_san
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./leviboost_tests_san

  android:
    name: android arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Build libleviboost.so
        run: |
          cmake -S . -B build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_FLAGS="-Wl,-z,max-page-size=16384"
          cmake --build build/android --target leviboost

      - name: Verify the library's linkage and preloader symbols
        run: |
          SO=build/android/out/arm64-v8a/libleviboost.so
          echo "library size: $(stat -c%s "$SO") bytes"
          echo "--- NEEDED ---"
          readelf -d "$SO" | grep NEEDED

          # The launcher process already has libc++_shared.so mapped, and the
          # mod must use that same C++ runtime (never a private static copy).
          if ! readelf -d "$SO" | grep -q 'libc++_shared.so'; then
            echo "::error::libc++_shared.so is not in NEEDED"
            exit 1
          fi

          # GL entry points are resolved at runtime, so a hard dependency on a
          # GL library would mean the mod was linked against the wrong thing.
          if readelf -d "$SO" | grep -Eq 'libEGL|libGLES'; then
            echo "::error::the library hard-links a GL/EGL library"
            exit 1
          fi

          # These have to stay undefined: libpreloader.so provides them at
          # dlopen() time.
          UNDEFINED=$(nm -u "$SO")
          for symbol in \
            _ZN2pl3mod9NativeMod7currentEv \
            _ZN2pl6memory4hookEPvS1_PS1_NS0_12HookPriorityE \
            _ZN2pl6memory6unhookEPvS1_ \
            _ZN2pl7modmenu14registerModuleERKNS0_10ModuleInfoE \
            _ZN2pl7modmenu14registerButtonERKNS0_10ButtonInfoE \
            _ZN2pl7modmenu17getHudSurfaceSizeEv; do
            if ! echo "$UNDEFINED" | grep -q "$symbol"; then
              echo "::error::missing preloader symbol $symbol"
              exit 1
            fi
          done
          echo "--- undefined preloader (pl::) symbols ---"
          echo "$UNDEFINED" | grep "_ZN2pl" | sort

      - name: Package the .levipack
        run: |
          python3 scripts/package_levipack.py \
            --library build/android/out/arm64-v8a/libleviboost.so \
            --output dist/LeviBoost.levipack
          python3 scripts/verify_levipack.py dist/LeviBoost.levipack
          echo "package size: $(stat -c%s dist/LeviBoost.levipack) bytes"

      - name: Publish build stats
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SO=build/android/out/arm64-v8a/libleviboost.so
          SIZE_SO=$(stat -c%s "$SO" 2>/dev/null || echo 0)
          SIZE_PACK=$(stat -c%s dist/LeviBoost.levipack 2>/dev/null || echo 0)
          OPT=$(grep -ohE '\-O[0-9sz]' build/android/compile_commands.json 2>/dev/null | sort -u | tr -d '\n' || true)
          STD=$(grep -ohE '\-std=[a-z+0-9]+' build/android/compile_commands.json 2>/dev/null | sort -u | tr -d '\n' || true)
          DBG=$(readelf -S "$SO" 2>/dev/null | grep -c '\.debug_' || true)
          DESC="so=${SIZE_SO}B pack=${SIZE_PACK}B opt=${OPT:-?} std=${STD:-?} debugSections=${DBG}"
          echo "$DESC"
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context=leviboost-build-stats \
            -f description="${DESC:0:140}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: LeviBoost-levipack
          path: dist/LeviBoost.levipack
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LeviBoost.levipack
