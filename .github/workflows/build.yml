name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the optimization engine tests
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Wno-unused-parameter \
            -Isrc -Itests/stubs \
            tests/optimizations_test.cpp src/Optimizations.cpp src/Settings.cpp \
            -o leviboost_tests
          ./leviboost_tests

      - name: Run the tests under AddressSanitizer and UBSan
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -Wno-unused-parameter \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc -Itests/stubs \
            tests/optimizations_test.cpp src/Optimizations.cpp src/Settings.cpp \
            -o leviboost_tests_san
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./leviboost_tests_san

  android:
    name: android arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Build libleviboost.so
        run: |
          cmake -S . -B build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wl,-z,max-page-size=16384"
          cmake --build build/android --target leviboost

      - name: Package the .levipack
        run: |
          python3 scripts/package_levipack.py \
            --library build/android/out/arm64-v8a/libleviboost.so \
            --output dist/LeviBoost.levipack
          python3 scripts/verify_levipack.py dist/LeviBoost.levipack

      - name: Check which preloader symbols are required
        run: |
          readelf -d build/android/out/arm64-v8a/libleviboost.so | grep NEEDED
          echo "--- undefined preloader (pl::) symbols ---"
          nm -u build/android/out/arm64-v8a/libleviboost.so | grep "_ZN2pl" | sort

      - uses: actions/upload-artifact@v4
        with:
          name: LeviBoost-levipack
          path: dist/LeviBoost.levipack
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LeviBoost.levipack
